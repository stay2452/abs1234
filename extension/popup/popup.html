<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Eye of Zuck</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <span class="brand-mark"><img src="../icons/icon48.png" alt="" width="36" height="36" /></span>
        <span class="brand-text">Eye of Zuck<small>Instagram · Railway</small></span>
      </div>
      <div class="header-right">
        <span id="status" class="status status-off">…</span>
        <button id="pin" class="pin-btn" type="button">Fixar</button>
      </div>
    </header>

    <section class="card" id="login-card">
      <p class="label">Sua conta — entre para usar</p>
      <label class="field">
        <span class="label">Email</span>
        <input id="login-email" type="email" placeholder="voce@agencia.com" autocomplete="email" spellcheck="false" />
      </label>
      <label class="field">
        <span class="label">Senha</span>
        <input id="login-password" type="password" placeholder="••••••••" autocomplete="current-password" />
      </label>
      <button id="login-btn" class="btn primary btn-block" type="button">Entrar</button>
      <p class="meta meta-center">O login cria seu token sozinho. Perfis caem na sua biblioteca.</p>
    </section>

    <section class="card" id="account-card" hidden>
      <p class="label">Conectado como</p>
      <p id="account-name" class="preview">—</p>
      <p id="account-role" class="meta"></p>
      <button id="logout-btn" class="btn secondary btn-block" type="button">Sair (revoga o token)</button>
    </section>

    <section class="card" id="aba-card" hidden>
      <p class="label">Aba atual (Instagram)</p>
      <p id="preview" class="preview">Detectando…</p>
      <p id="preview-meta" class="meta"></p>
    </section>

    <section class="card" id="folder-card" hidden>
      <label class="field">
        <span class="label">Pasta (opcional)</span>
        <select id="folder">
          <option value="">Sem pasta</option>
          <option value="__new__">+ Criar pasta nova…</option>
        </select>
      </label>
      <div id="new-folder-wrap" hidden>
        <label class="field">
          <span class="label">Nome da pasta</span>
          <input id="new-folder-name" type="text" maxlength="60" placeholder="Ex: Fitness, Beleza…" autocomplete="off" />
        </label>
      </div>
    </section>

    <div class="actions" id="actions" hidden>
      <button id="import" class="btn primary btn-block" type="button" disabled>Importar para o tracker</button>
    </div>

    <p id="feedback" class="feedback" role="status"></p>

    <div class="links" id="links" hidden>
      <a id="open-app" href="https://abs1234-production.up.railway.app/" target="_blank" rel="noreferrer">Abrir app</a>
      <a id="open-profiles" href="https://abs1234-production.up.railway.app/profiles" target="_blank" rel="noreferrer">Perfis</a>
      <a id="open-admin" href="https://abs1234-production.up.railway.app/admin/atividade" target="_blank" rel="noreferrer" hidden>Atividade</a>
      <button id="refresh" class="linkish" type="button">Atualizar</button>
    </div>

    <script src="popup.js"></script>
  </body>
</html>
